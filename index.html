<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Expense Tracker</title><link rel="stylesheet" href="style.css"></head><body><main class="container"><h1>Expense Tracker</h1><p class="sub">Track your income, expenses and balance.</p><section class="summary"><div><span>Income</span><b id="income">₹0</b></div><div><span>Expenses</span><b id="expense">₹0</b></div><div><span>Balance</span><b id="balance">₹0</b></div></section><section class="card"><form id="form"><input id="title" placeholder="Description" required><input id="amount" type="number" min="1" placeholder="Amount" required><select id="type"><option value="income">Income</option><option value="expense">Expense</option></select><button>Add Transaction</button></form></section><section class="card"><h2>Transactions</h2><ul id="list"></ul></section></main><script src="script.js"></script></body></html>
